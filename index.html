<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e40af">
<title>多元職能推廣協會交接系統</title>
<link rel="manifest" href="data:application/json,{}">
<style>
  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --border: #e2e8f0;
    --primary: #1e40af;
    --primary-light: #3b82f6;
    --primary-pale: #eff6ff;
    --accent: #0369a1;
    --text: #1e293b;
    --text-2: #475569;
    --text-3: #94a3b8;
    --danger: #dc2626;
    --danger-pale: #fef2f2;
    --success: #16a34a;
    --success-pale: #f0fdf4;
    --warning: #d97706;
    --warning-pale: #fffbeb;
    --info: #0891b2;
    --info-pale: #ecfeff;
    --purple: #7c3aed;
    --purple-pale: #f5f3ff;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; }

  /* LOGIN */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #0369a1 100%); }
  .login-box { background: var(--surface); border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  .login-logo { text-align: center; margin-bottom: 28px; }
  .login-logo h1 { font-size: 22px; font-weight: 700; color: var(--primary); margin-top: 8px; }
  .login-logo p { color: var(--text-2); font-size: 13px; margin-top: 4px; }
  .login-icon { width: 56px; height: 56px; background: var(--primary-pale); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 26px; }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius);
    font-size: 14px; color: var(--text); background: var(--surface); transition: border-color .15s;
    outline: none; font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
  .form-group textarea { resize: vertical; min-height: 80px; }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all .15s; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: #15803d; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-ghost { background: transparent; color: var(--text-2); border: 1.5px solid var(--border); }
  .btn-ghost:hover { background: var(--bg); }
  .btn-full { width: 100%; justify-content: center; padding: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* LAYOUT */
  .app { display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 230px; background: var(--primary); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 20px 16px 16px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .sidebar-header h2 { color: #fff; font-size: 16px; font-weight: 700; }
  .sidebar-header p { color: rgba(255,255,255,.6); font-size: 12px; margin-top: 2px; }
  .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
  .nav-section { margin-bottom: 8px; }
  .nav-section-label { color: rgba(255,255,255,.45); font-size: 11px; font-weight: 700; padding: 4px 8px; letter-spacing: .05em; text-transform: uppercase; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: rgba(255,255,255,.8); cursor: pointer; font-size: 14px; transition: all .15s; margin-bottom: 2px; }
  .nav-item:hover { background: rgba(255,255,255,.1); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,.18); color: #fff; font-weight: 600; }
  .nav-item .nav-icon { font-size: 17px; width: 20px; text-align: center; }
  .sidebar-footer { padding: 12px 8px; border-top: 1px solid rgba(255,255,255,.1); }
  .user-info { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; }
  .user-avatar { width: 32px; height: 32px; background: rgba(255,255,255,.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .user-name { color: #fff; font-size: 13px; font-weight: 600; }
  .user-role { color: rgba(255,255,255,.55); font-size: 11px; }

  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; box-shadow: var(--shadow); }
  .topbar h1 { font-size: 18px; font-weight: 700; color: var(--text); }
  .content { flex: 1; overflow-y: auto; padding: 24px; }

  /* CARDS */
  .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 16px; }
  .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .card-body { padding: 20px; }

  /* FILTERS */
  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-bar select, .filter-bar input { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 13px; color: var(--text); background: var(--surface); outline: none; }
  .filter-bar select:focus, .filter-bar input:focus { border-color: var(--primary-light); }

  /* RECORD LIST */
  .record-list { display: flex; flex-direction: column; gap: 10px; }
  .record-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); transition: box-shadow .15s; cursor: pointer; }
  .record-card:hover { box-shadow: var(--shadow-md); }
  .record-card.resolved { opacity: .65; }
  .record-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .record-title { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; line-height: 1.4; }
  .record-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .meta-tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .record-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .record-time { font-size: 12px; color: var(--text-3); }

  /* BADGES */
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 700; display: inline-block; }
  .badge-abnormal { background: var(--danger-pale); color: var(--danger); }
  .badge-counseling { background: var(--purple-pale); color: var(--purple); }
  .badge-task { background: var(--warning-pale); color: var(--warning); }
  .badge-log { background: var(--surface2); color: var(--text-2); border: 1px solid var(--border); }
  .badge-equipment { background: var(--info-pale); color: var(--info); }
  .badge-open { background: var(--warning-pale); color: var(--warning); }
  .badge-resolved { background: var(--success-pale); color: var(--success); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .modal-title { font-size: 17px; font-weight: 700; }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
  .close-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--bg); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; color: var(--text-2); }
  .close-btn:hover { background: var(--border); }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .stat-value { font-size: 28px; font-weight: 800; color: var(--primary); }
  .stat-label { font-size: 12px; color: var(--text-2); margin-top: 3px; font-weight: 600; }

  /* CHECK LIST */
  .check-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .check-item:last-child { border-bottom: none; }
  .check-item-name { flex: 1; font-size: 14px; }
  .check-options { display: flex; gap: 8px; }
  .check-opt { padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; background: var(--surface); color: var(--text-2); }
  .check-opt.sel-completed { border-color: var(--success); background: var(--success-pale); color: var(--success); }
  .check-opt.sel-ignored { border-color: var(--warning); background: var(--warning-pale); color: var(--warning); }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--surface2); padding: 4px; border-radius: var(--radius); border: 1px solid var(--border); width: fit-content; }
  .tab { padding: 7px 16px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-2); transition: all .15s; border: none; background: none; }
  .tab.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }

  /* EMPTY */
  .empty { text-align: center; padding: 48px 20px; color: var(--text-3); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }

  /* LOADING */
  .loading { text-align: center; padding: 32px; color: var(--text-3); font-size: 14px; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ALERT */
  .alert { padding: 12px 16px; border-radius: var(--radius); font-size: 13px; margin-bottom: 14px; font-weight: 500; }
  .alert-error { background: var(--danger-pale); color: var(--danger); border: 1px solid #fecaca; }
  .alert-success { background: var(--success-pale); color: var(--success); border: 1px solid #bbf7d0; }

  /* DIVIDER */
  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* RESOLVE SECTION */
  .resolve-box { background: var(--success-pale); border: 1px solid #bbf7d0; border-radius: var(--radius); padding: 14px; margin-top: 12px; }
  .resolve-box p { font-size: 13px; color: var(--success); font-weight: 600; margin-bottom: 6px; }
  .resolve-box span { font-size: 12px; color: var(--text-2); }

  /* MOBILE FIRST */
  .sidebar { display: none; }
  .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); z-index: 50; box-shadow: 0 -2px 12px rgba(0,0,0,.08); }
  .bottom-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 4px 10px; cursor: pointer; color: var(--text-3); font-size: 10px; font-weight: 600; gap: 3px; transition: color .15s; border: none; background: none; }
  .bottom-nav-item.active { color: var(--primary); }
  .bottom-nav-item .bnav-icon { font-size: 22px; line-height: 1; }
  .main { padding-bottom: 68px; }
  .content { padding: 14px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .topbar { padding: 12px 16px; }
  .topbar h1 { font-size: 16px; }
  .grid-2 { grid-template-columns: 1fr; }
  .modal { border-radius: 20px 20px 0 0; position: fixed; bottom: 0; left: 0; right: 0; max-width: 100%; max-height: 92vh; margin: 0; }
  .modal-overlay { align-items: flex-end; padding: 0; }
  .filter-bar { flex-direction: column; }
  .filter-bar select, .filter-bar input { width: 100%; }
  .tabs { width: 100%; }
  .tab { flex: 1; text-align: center; }
  .login-box { border-radius: 0; min-height: 100vh; max-width: 100%; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; }
  .login-logo h1 { font-size: 19px; }
  @media (min-width: 768px) {
    .sidebar { display: flex; }
    .bottom-nav { display: none; }
    .main { padding-bottom: 0; }
    .content { padding: 24px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .modal { position: relative; border-radius: 14px; max-width: 520px; margin: auto; }
    .modal-overlay { align-items: center; padding: 20px; }
    .filter-bar { flex-direction: row; }
    .filter-bar select, .filter-bar input { width: auto; }
    .tabs { width: fit-content; }
    .tab { flex: none; }
    .login-box { border-radius: 16px; min-height: auto; max-width: 380px; padding: 40px; }
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .text-sm { font-size: 13px; }
  .text-muted { color: var(--text-2); }
  .mt-2 { margin-top: 8px; }
  .mt-3 { margin-top: 12px; }
  .flex { display: flex; }
  .gap-2 { gap: 8px; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .flex-wrap { flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useCallback, useRef } = React;

const API_URL = 'https://script.google.com/macros/s/AKfycbz1VaAERYmg-QnjIalaHKZUGwXnJcD9xsU8JGIXbUi3bBRhKcef-zM5jHe7Eu_DjoDv-g/exec';

async function api(action, body = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, ...body }),
  });
  return res.json();
}

const TYPE_MAP = {
  abnormal: { label: '課堂異常', badge: 'badge-abnormal', icon: '🚨' },
  counseling: { label: '學員輔導', badge: 'badge-counseling', icon: '📚' },
  task: { label: '課程交辦', badge: 'badge-task', icon: '📋' },
  log: { label: '課堂記錄', badge: 'badge-log', icon: '📝' },
  equipment: { label: '設備異常', badge: 'badge-equipment', icon: '🔧' },
};

const ROLE_MAP = { admin: '系統管理員', supervisor: '主管', assistant: '助教', maintenance: '維護人員' };

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  return isNaN(d) ? s : d.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

// ===== LOGIN =====
function Login({ onLogin }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [mode, setMode] = useState('login'); // 'login' | 'forgot'
  const [forgotEmail, setForgotEmail] = useState('');
  const [forgotMsg, setForgotMsg] = useState('');
  const [forgotError, setForgotError] = useState('');
  const [forgotLoading, setForgotLoading] = useState(false);

  async function handleLogin() {
    if (!email || !password) { setError('請輸入帳號與密碼'); return; }
    setLoading(true); setError('');
    const res = await api('login', { email, password });
    setLoading(false);
    if (res.success) onLogin(res.user);
    else setError(res.message || '登入失敗');
  }

  async function handleForgot() {
    if (!forgotEmail) { setForgotError('請輸入您的 Email'); return; }
    setForgotLoading(true); setForgotError(''); setForgotMsg('');
    const res = await api('forgotPassword', { email: forgotEmail });
    setForgotLoading(false);
    if (res.success) setForgotMsg(res.message);
    else setForgotError(res.message || '發送失敗，請稍後再試');
  }

  function switchToForgot() {
    setForgotEmail(email);
    setForgotMsg(''); setForgotError('');
    setMode('forgot');
  }

  if (mode === 'forgot') return (
    React.createElement('div', { className: 'login-wrap' },
      React.createElement('div', { className: 'login-box' },
        React.createElement('div', { className: 'login-logo' },
          React.createElement('div', { className: 'login-icon' }, '🔑'),
          React.createElement('h1', null, '重設密碼'),
          React.createElement('p', null, '多元職能推廣協會交接系統')
        ),
        forgotMsg
          ? React.createElement('div', null,
              React.createElement('div', { className: 'alert alert-success' }, '✓ ' + forgotMsg),
              React.createElement('p', { className: 'text-sm text-muted', style: { marginBottom: 16, lineHeight: 1.6 } },
                '請檢查您的信箱，使用臨時密碼登入後，請立即更改密碼。'
              ),
              React.createElement('button', { className: 'btn btn-primary btn-full', onClick: () => { setMode('login'); setForgotMsg(''); } }, '← 返回登入')
            )
          : React.createElement('div', null,
              React.createElement('p', { className: 'text-sm text-muted', style: { marginBottom: 16, lineHeight: 1.6 } },
                '請輸入您的帳號 Email，系統將寄送臨時密碼到您的信箱。'
              ),
              forgotError && React.createElement('div', { className: 'alert alert-error' }, forgotError),
              React.createElement('div', { className: 'form-group' },
                React.createElement('label', null, 'Email'),
                React.createElement('input', {
                  type: 'email', value: forgotEmail,
                  onChange: e => setForgotEmail(e.target.value),
                  placeholder: '請輸入帳號 Email',
                  onKeyDown: e => e.key === 'Enter' && handleForgot()
                })
              ),
              React.createElement('button', {
                className: 'btn btn-primary btn-full',
                onClick: handleForgot,
                disabled: forgotLoading
              }, forgotLoading
                ? React.createElement('span', null, React.createElement('span', { className: 'spinner' }), '寄送中...')
                : '寄送臨時密碼'
              ),
              React.createElement('button', {
                className: 'btn btn-ghost btn-full',
                style: { marginTop: 10 },
                onClick: () => setMode('login')
              }, '← 返回登入')
            )
      )
    )
  );

  return (
    React.createElement('div', { className: 'login-wrap' },
      React.createElement('div', { className: 'login-box' },
        React.createElement('div', { className: 'login-logo' },
          React.createElement('div', { className: 'login-icon' }, '🏫'),
          React.createElement('h1', null, '多元職能推廣協會交接系統'),
          React.createElement('p', null, '工作人員交接平台')
        ),
        error && React.createElement('div', { className: 'alert alert-error' }, error),
        React.createElement('div', { className: 'form-group' },
          React.createElement('label', null, 'Email'),
          React.createElement('input', { type: 'email', value: email, onChange: e => setEmail(e.target.value), placeholder: '請輸入 Email', onKeyDown: e => e.key === 'Enter' && handleLogin() })
        ),
        React.createElement('div', { className: 'form-group' },
          React.createElement('label', null, '密碼'),
          React.createElement('input', { type: 'password', value: password, onChange: e => setPassword(e.target.value), onKeyDown: e => e.key === 'Enter' && handleLogin() })
        ),
        React.createElement('div', { style: { textAlign: 'right', marginBottom: 16, marginTop: -8 } },
          React.createElement('span', {
            style: { fontSize: 13, color: 'var(--primary)', cursor: 'pointer', fontWeight: 600 },
            onClick: switchToForgot
          }, '忘記密碼？')
        ),
        React.createElement('button', { className: 'btn btn-primary btn-full', onClick: handleLogin, disabled: loading },
          loading ? React.createElement('span', null, React.createElement('span', { className: 'spinner' }), '登入中...') : '登入'
        )
      )
    )
  );
}

// ===== MODAL =====
function Modal({ title, onClose, children, footer }) {
  return React.createElement('div', { className: 'modal-overlay', onClick: e => e.target === e.currentTarget && onClose() },
    React.createElement('div', { className: 'modal' },
      React.createElement('div', { className: 'modal-header' },
        React.createElement('span', { className: 'modal-title' }, title),
        React.createElement('button', { className: 'close-btn', onClick: onClose }, '✕')
      ),
      React.createElement('div', { className: 'modal-body' }, children),
      footer && React.createElement('div', { className: 'modal-footer' }, footer)
    )
  );
}

// ===== RECORD FORM =====
function RecordForm({ classes, classrooms, user, onSubmit, onClose }) {
  const [form, setForm] = useState({ type: 'abnormal', class_id: '', classroom_id: '', date: new Date().toISOString().split('T')[0], description: '', notify_target: '' });

      showRoomForm && React.createElement(Modal, { title: '新增教室', onClose: () => setShowRoomForm(false),
        footer: React.createElement(React.Fragment, null,
          React.createElement('button', { className: 'btn btn-ghost', onClick: () => setShowRoomForm(false) }, '取消'),
          React.createElement('button', { className: 'btn btn-primary', onClick: createRoom }, '新增')
        )
      },
        React.createElement('div', { className: 'form-group' }, React.createElement('label', null, '教室名稱'), React.createElement('input', { value: newRoom.name, onChange: e => setNewRoom(f => ({ ...f, name: e.target.value })) })),
        React.createElement('div', { className: 'form-group' }, React.createElement('label', null, '說明'), React.createElement('input', { value: newRoom.description, onChange: e => setNewRoom(f => ({ ...f, description: e.target.value })) }))
      )
    ),

    tab === 'checkitems' && React.createElement('div', null,
      React.createElement('div', { className: 'flex justify-between items-center', style: { marginBottom: 12 } },
        React.createElement('span', { className: 'text-sm text-muted' }, '為各教室設定課後檢查項目'),
        React.createElement('button', { className: 'btn btn-primary', onClick: () => setShowCheckItemForm(true) }, '+ 新增檢查項目')
      ),
      msg && React.createElement('div', { className: 'alert alert-error' }, msg),
      showCheckItemForm && React.createElement(Modal, { title: '新增教室檢查項目', onClose: () => setShowCheckItemForm(false),
        footer: React.createElement(React.Fragment, null,
          React.createElement('button', { className: 'btn btn-ghost', onClick: () => setShowCheckItemForm(false) }, '取消'),
          React.createElement('button', { className: 'btn btn-primary', onClick: createCheckItems }, '儲存')
        )
      },
        React.createElement('div', { className: 'form-group' },
          React.createElement('label', null, '選擇教室'),
          React.createElement('select', { value: newCheckItem.classroom_id, onChange: e => setNewCheckItem(f => ({ ...f, classroom_id: e.target.value })) },
            React.createElement('option', { value: '' }, '請選擇教室'),
            classrooms.map(c => React.createElement('option', { key: c.id, value: c.id }, c.name))
          )
        ),
        React.createElement('div', { className: 'form-group' },
          React.createElement('label', null, '檢查項目'),
          newCheckItem.items.map((item, idx) =>
            React.createElement('div', { key: idx, className: 'flex gap-2 items-center', style: { marginBottom: 8 } },
              React.createElement('input', { style: { flex: 1 }, placeholder: `項目 ${idx + 1}`, value: item.item_name, onChange: e => setNewCheckItem(f => ({ ...f, items: f.items.map((it, i) => i === idx ? { ...it, item_name: e.target.value } : it) })) })
            )
          ),
          React.createElement('button', { className: 'btn btn-ghost', style: { marginTop: 6 }, onClick: addCheckItemRow }, '+ 新增項目')
        )
      )
    )
  );
}

// ===== DASHBOARD =====
function Dashboard({ user, classes, classrooms }) {
  const [stats, setStats] = useState({ total: 0, open: 0, equipment: 0, resolved: 0 });

  useEffect(() => {
    api('getRecords', {}).then(r => {
      if (r.success && r.data) {
        const d = r.data;
        setStats({
          total: d.length,
          open: d.filter(x => x.status !== 'resolved' && x.type !== 'log').length,
          equipment: d.filter(x => x.type === 'equipment').length,
          resolved: d.filter(x => x.status === 'resolved').length,
        });
      }
    });
  }, []);

  return React.createElement('div', null,
    React.createElement('div', { className: 'stats-grid' },
      [
        { label: '總記錄數', value: stats.total, color: '#1e40af' },
        { label: '待處理', value: stats.open, color: '#d97706' },
        { label: '設備異常', value: stats.equipment, color: '#0891b2' },
        { label: '已解決', value: stats.resolved, color: '#16a34a' },
      ].map(s => React.createElement('div', { key: s.label, className: 'stat-card' },
        React.createElement('div', { className: 'stat-value', style: { color: s.color } }, s.value),
        React.createElement('div', { className: 'stat-label' }, s.label)
      ))
    ),
    React.createElement('div', { className: 'card' },
      React.createElement('div', { className: 'card-header' },
        React.createElement('span', { className: 'card-title' }, '歡迎回來，' + user.name)
      ),
      React.createElement('div', { className: 'card-body' },
        React.createElement('p', { className: 'text-sm text-muted' }, '角色：', ROLE_MAP[user.role] || user.role),
        React.createElement('p', { className: 'text-sm text-muted mt-2' }, '目前系統有 ', React.createElement('strong', null, stats.open), ' 筆記錄待處理')
      )
    )
  );
}

// ===== MAIN APP =====
function App() {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [classes, setClasses] = useState([]);
  const [classrooms, setClassrooms] = useState([]);

  async function loadMeta() {
    const [c, r] = await Promise.all([api('getClasses'), api('getClassrooms')]);
    if (c.success) setClasses(c.data || []);
    if (r.success) setClassrooms(r.data || []);
  }

  useEffect(() => { if (user) loadMeta(); }, [user]);

  if (!user) return React.createElement(Login, { onLogin: u => { setUser(u); setPage('dashboard'); } });

  const isAdmin = user.role === 'admin';

  const navItems = [
    { key: 'dashboard', icon: '🏠', label: '總覽', show: true },
    { key: 'records', icon: '📋', label: '交接', show: true },
    { key: 'check', icon: '✅', label: '課後檢查', show: true },
    { key: 'admin', icon: '⚙️', label: '管理', show: isAdmin },
    { key: 'logout', icon: '🚪', label: '登出', show: true },
  ];

  const titles = { dashboard: '總覽', records: '交接記錄', check: '課後檢查', admin: '系統管理' };

  function handleNav(key) {
    if (key === 'logout') { setUser(null); return; }
    setPage(key);
  }

  return React.createElement('div', { className: 'app' },
    React.createElement('div', { className: 'sidebar' },
      React.createElement('div', { className: 'sidebar-header' },
        React.createElement('h2', null, '🏫 多元職能推廣協會'),
        React.createElement('p', null, '交接系統')
      ),
      React.createElement('nav', { className: 'sidebar-nav' },
        React.createElement('div', { className: 'nav-section' },
          navItems.filter(n => n.show && n.key !== 'logout').map(n =>
            React.createElement('div', { key: n.key, className: `nav-item ${page === n.key ? 'active' : ''}`, onClick: () => setPage(n.key) },
              React.createElement('span', { className: 'nav-icon' }, n.icon),
              n.label
            )
          )
        )
      ),
      React.createElement('div', { className: 'sidebar-footer' },
        React.createElement('div', { className: 'user-info' },
          React.createElement('div', { className: 'user-avatar' }, user.name[0]),
          React.createElement('div', null,
            React.createElement('div', { className: 'user-name' }, user.name),
            React.createElement('div', { className: 'user-role' }, ROLE_MAP[user.role] || user.role)
          )
        ),
        React.createElement('div', { className: 'nav-item', style: { marginTop: 4 }, onClick: () => setUser(null) },
          React.createElement('span', { className: 'nav-icon' }, '🚪'), '登出'
        )
      )
    ),
    React.createElement('div', { className: 'main' },
      React.createElement('div', { className: 'topbar' },
        React.createElement('div', null,
          React.createElement('h1', null, titles[page] || ''),
          React.createElement('p', { className: 'text-sm text-muted', style:{marginTop:2} }, '多元職能推廣協會')
        ),
        React.createElement('div', { className: 'user-avatar', style:{background:'#e0e7ff',color:'#1e40af',width:34,height:34,fontSize:14} }, user.name[0])
      ),
      React.createElement('div', { className: 'content' },
        page === 'dashboard' && React.createElement(Dashboard, { user, classes, classrooms }),
        page === 'records' && React.createElement(RecordsPage, { user, classes, classrooms }),
        page === 'check' && React.createElement(CheckPage, { user, classrooms }),
        page === 'admin' && isAdmin && React.createElement(AdminPage, { classes, classrooms, onRefresh: loadMeta })
      )
    ),
    React.createElement('nav', { className: 'bottom-nav' },
      navItems.filter(n => n.show).map(n =>
        React.createElement('button', { key: n.key, className: `bottom-nav-item ${page === n.key ? 'active' : ''}`, onClick: () => handleNav(n.key) },
          React.createElement('span', { className: 'bnav-icon' }, n.icon),
          n.label
        )
      )
    )
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
